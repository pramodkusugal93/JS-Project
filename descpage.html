<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!--  NAVBAR -->

    <nav>

        <div class="logo">

            <img src="icon.jpeg" alt="logo">

            <h1>MEAL FINDER</h1>

        </div>


        <button id="menuButton">

            <i class="fa-solid fa-bars"></i>

        </button>

    </nav>



    <!--  SIDE MENU  -->

    <div id="sideMenu">

        <div class="menu-header">
            <button id="closeButton">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>


        <div id="categoryList">

            <!-- API categories will come here -->

        </div>


    </div>



    <!--  HERO  -->

    <section class="hero">


        <div class="hero-content">

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search recipes here...">
                <button id="searchButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <h2>
                What are your favorite cuisines?
            </h2>

            <p>
                PERSONALIZE YOUR EXPERIENCE
            </p>

        </div>

    </section>



    <!--  SEARCH RESULTS  -->

<section class="meals" id="mealsSection">

    <div class="container-fluid">
        <h2 id="searchTitle">MEALS</h2>
        <div class="orange-line"></div>
        <div class="row" id="mealCards"></div>
    </div>

</section>






    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript -->

    <script src="desc.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Details - Meal Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="/index.html" class="mealhead"><div class="logo">
            <img src="icon.jpeg" alt="logo">
            <h1>MEAL FINDER</h1>
        </div></a>

        <button id="menuButton">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- SIDE MENU -->
    <div id="sideMenu">

        <div class="menu-header">
            <button id="closeButton">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>

        <div id="categoryList"></div>
    </div>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search recipes here..."
                >

                <button id="searchButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <h2>What are your favorite cuisines?</h2>
            <p>PERSONALIZE YOUR EXPERIENCE</p>

        </div>
    </section>

    <!-- BREADCRUMB -->

<div class="meal-breadcrumb">
    <i class="fa-solid fa-house"></i>
    <i class="fa-solid fa-angle-right"></i>
    <span id="breadcrumbMeal">MEAL DETAILS</span>
</div>

    <!-- MEAL DETAILS -->
    <section class="meal-details-section">

        <div class="container-fluid">

            <h2>MEAL DETAILS</h2>
            <div class="orange-line"></div>

            <div id="mealDetails">
                <p>Loading meal details...</p>
            </div>

        </div>

    </section>

    <!-- CATEGORIES -->
    <section class="categories">

        <div class="container-fluid">

            <h2>CATEGORIES</h2>
            <div class="orange-line"></div>

            <div class="row" id="detailCategoryCards"></div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="third.js"></script>

</body>
</html>
